name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Validar los shaders GLSL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools
          python3 tools/check_shaders.py

      - name: Tests de logica
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Compilar
        run: ./gradlew :app:assembleRelease --console=plain
