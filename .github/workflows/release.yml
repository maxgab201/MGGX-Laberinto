name: Publicar release

# Se dispara al empujar una etiqueta v* (por ejemplo v1.0.0).
# Tambien se puede correr a mano desde la pestana Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, por ejemplo 1.0.1'
        required: true
      nombre:
        description: 'Nombre de la release (si se deja vacio se elige solo)'
        required: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Elegir un nombre que no se haya usado
        id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOMBRE="${{ github.event.inputs.nombre }}"
          if [ -z "$NOMBRE" ]; then
            USADOS="$(gh release list --limit 100 --json name --jq '.[].name' || true)"
            ZONAS=(
              "Boca de la Cueva" "Galerias de Musgo" "Cavernas de Cuarzo" "Sima Helada"
              "Pozos de Azufre" "Venas de Magma" "Corredores de Obsidiana"
              "Corazon de Vetagris" "Grieta del Eco" "Pozo sin Fondo"
              "Sala de las Mil Columnas" "Rio Subterraneo" "Boveda de Sal"
              "Camara de los Ecos" "Garganta Negra" "Ultimo Descenso"
            )
            for z in "${ZONAS[@]}"; do
              if ! grep -qF "$z" <<<"$USADOS"; then NOMBRE="$z"; break; fi
            done
            [ -n "$NOMBRE" ] || NOMBRE="Descenso ${{ steps.v.outputs.version }}"
          fi
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Compilar el APK firmado
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Renombrar y sacar la huella de la firma
        id: apk
        run: |
          V="${{ steps.v.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "MGGX-Laberinto-$V.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          HUELLA="$("$BT/apksigner" verify --print-certs "MGGX-Laberinto-$V.apk" \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          echo "huella=$HUELLA" >> "$GITHUB_OUTPUT"
          echo "peso=$(du -h "MGGX-Laberinto-$V.apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          N="${{ steps.n.outputs.nombre }}"
          cat > /tmp/notas.md <<EOF
          ## MGGX Laberinto $V - $N

          Juego de laberintos en 3D, primera persona, para Android. Nativo, sin
          motores de terceros y sin archivos de arte ni de audio: la roca, los
          brazos, los iconos, la musica y los efectos se generan por codigo.

          ### Para instalarlo
          1. Bajate el APK de aca abajo directo al celular.
          2. Abrilo. Android te va a pedir permiso para instalar apps de origen
             desconocido: dale que si.
          3. Listo. No hace falta desinstalar la version anterior: todas las
             publicaciones van firmadas con la misma clave.

          ### Datos
          - Android 7.0 (API 24) o superior
          - Necesita OpenGL ES 3.0
          - Pesa ${{ steps.apk.outputs.peso }}
          - Firma SHA-256: \`${{ steps.apk.outputs.huella }}\`
          EOF
          gh release create "v$V" "MGGX-Laberinto-$V.apk" \
            --title "MGGX Laberinto $V - $N" \
            --notes-file /tmp/notas.md
