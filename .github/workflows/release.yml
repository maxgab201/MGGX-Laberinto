name: Publicar release

# Se dispara al empujar una etiqueta v* (por ejemplo v1.0.0).
# Tambien se puede correr a mano desde la pestana Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Dejalo VACIO: se toma el versionName del proyecto'
        required: false
      nombre:
        description: 'Dejalo VACIO: se elige un nombre de zona sin usar'
        required: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      # app/google-services.json esta en .gitignore (es la config del proyecto
      # de Firebase de cada uno), asi que el checkout no lo trae. Sin este paso
      # el APK compila igual pero sale sin Firebase adentro, y el multijugador
      # arranca diciendo que falta la configuracion. Por eso corta el build en
      # vez de publicar una release con el modo de a varios roto.
      - name: Poner la configuracion de Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Falta el secreto GOOGLE_SERVICES_JSON."
            echo
            echo "Se carga una sola vez, en el repositorio:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo "  Name:   GOOGLE_SERVICES_JSON"
            echo "  Secret: todo el contenido de app/google-services.json"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          # Un secreto mal pegado (recortado, con comillas de mas) compila lo
          # mismo y falla recien en el telefono. Se revisa aca.
          if ! jq -e . app/google-services.json >/dev/null 2>&1; then
            echo "El secreto GOOGLE_SERVICES_JSON no es un JSON valido."
            exit 1
          fi
          PAQUETE="$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          if ! jq -e --arg p "$PAQUETE" \
              '.client[]?.client_info.android_client_info.package_name | select(. == $p)' \
              app/google-services.json >/dev/null; then
            echo "El google-services.json no tiene ninguna app registrada para $PAQUETE."
            echo "En la consola de Firebase hay que agregar la app de Android con"
            echo "ese nombre de paquete, exacto, y bajar el archivo de nuevo."
            exit 1
          fi
          echo "Configuracion de Firebase puesta para $PAQUETE."

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          # Si no la escribieron a mano se saca del propio proyecto, asi no hay
          # forma de publicar una version que no coincida con la del APK.
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            V="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          fi
          [ -n "$V" ] || { echo "No se pudo determinar la version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publicando la version $V"

      - name: Controlar que la version no este publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Ya existe la release v$V. Subi el versionName en app/build.gradle.kts."
            exit 1
          fi

      - name: Elegir un nombre que no se haya usado
        id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOMBRE="${{ github.event.inputs.nombre }}"
          # Si por error pusieron el numero de version en el campo del nombre,
          # se ignora: si no, la release queda llamada "1.0 - 1.0".
          if [ "$NOMBRE" = "${{ steps.v.outputs.version }}" ]; then NOMBRE=""; fi
          if [ -z "$NOMBRE" ]; then
            USADOS="$(gh release list --limit 100 --json name --jq '.[].name' || true)"
            ZONAS=(
              "Boca de la Cueva" "Galerias de Musgo" "Cavernas de Cuarzo" "Sima Helada"
              "Pozos de Azufre" "Venas de Magma" "Corredores de Obsidiana"
              "Corazon de Vetagris" "Grieta del Eco" "Pozo sin Fondo"
              "Sala de las Mil Columnas" "Rio Subterraneo" "Boveda de Sal"
              "Camara de los Ecos" "Garganta Negra" "Ultimo Descenso"
            )
            for z in "${ZONAS[@]}"; do
              if ! grep -qF "$z" <<<"$USADOS"; then NOMBRE="$z"; break; fi
            done
            [ -n "$NOMBRE" ] || NOMBRE="Descenso ${{ steps.v.outputs.version }}"
          fi
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Compilar el APK firmado
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Renombrar y sacar la huella de la firma
        id: apk
        run: |
          V="${{ steps.v.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "MGGX-Laberinto-$V.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          HUELLA="$("$BT/apksigner" verify --print-certs "MGGX-Laberinto-$V.apk" \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          echo "huella=$HUELLA" >> "$GITHUB_OUTPUT"
          echo "peso=$(du -h "MGGX-Laberinto-$V.apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Que el archivo estuviera al compilar no prueba que haya llegado adentro
      # del APK: el limpiador de recursos (isShrinkResources) no ve que el SDK
      # busque esos <string> de nombre, y se los puede llevar. Es justo la clase
      # de error que no se nota hasta que alguien abre el multijugador en el
      # telefono, asi que se mira el APK que se esta por publicar, no el build.
      - name: Controlar que el APK lleve la configuracion de Firebase
        run: |
          V="${{ steps.v.outputs.version }}"
          APPID="$(jq -r '.client[0].client_info.mobilesdk_app_id' app/google-services.json)"
          rm -rf /tmp/apkchk && mkdir -p /tmp/apkchk
          unzip -o -q "MGGX-Laberinto-$V.apk" resources.arsc -d /tmp/apkchk
          if ! strings /tmp/apkchk/resources.arsc | grep -qF "$APPID"; then
            echo "El APK salio SIN la configuracion de Firebase ($APPID no esta"
            echo "en sus recursos). Publicarlo asi seria publicar el multijugador"
            echo "roto, asi que se corta aca."
            exit 1
          fi
          echo "El APK lleva la configuracion de Firebase."

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          N="${{ steps.n.outputs.nombre }}"
          cat > /tmp/notas.md <<EOF
          ## MGGX Laberinto $V - $N

          Juego de laberintos en 3D, primera persona, para Android. Nativo, sin
          motores de terceros y sin archivos de arte ni de audio: la roca, los
          brazos, los iconos, la musica y los efectos se generan por codigo.

          ### Para instalarlo
          1. Bajate el APK de aca abajo directo al celular.
          2. Abrilo. Android te va a pedir permiso para instalar apps de origen
             desconocido: dale que si.
          3. Listo. No hace falta desinstalar la version anterior: todas las
             publicaciones van firmadas con la misma clave.

          ### Datos
          - Android 7.0 (API 24) o superior
          - Necesita OpenGL ES 3.0
          - Pesa ${{ steps.apk.outputs.peso }}
          - Firma SHA-256: \`${{ steps.apk.outputs.huella }}\`
          EOF
          gh release create "v$V" "MGGX-Laberinto-$V.apk" \
            --title "MGGX Laberinto $V - $N" \
            --notes-file /tmp/notas.md
